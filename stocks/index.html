<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSE Trade Signals</title>
  <meta name="description" content="Swing and day-trading signals for Nifty 100 stocks, tested on NSE prices with Groww charges, with a live dashboard." />
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="tag">NSE · Nifty 100 · Swing &amp; day trading</div>
    <h1>Trade <span>Signals</span></h1>
    <p class="sub" id="dataLine">Loading prices…</p>
  </header>

  <p class="warn"><strong>Not financial advice.</strong> These signals come from patterns tested on past prices.
    They are wrong often. Always use the stop-loss, and only use money you can afford to lose.</p>

  <section class="card" id="capitalCard">
    <label class="label" for="capital">How much money will you trade with?</label>
    <div class="capital-row">
      <span class="rupee">₹</span>
      <input id="capital" type="number" inputmode="numeric" min="100" step="100" value="1000" />
    </div>
    <div class="chips" id="capitalChips"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Trading style">
    <button type="button" role="tab" data-tab="swing" aria-selected="true">Swing<small>days to weeks</small></button>
    <button type="button" role="tab" data-tab="day" aria-selected="false">Day trading<small>same day</small></button>
    <button type="button" role="tab" data-tab="live" aria-selected="false">Live<small>market hours</small></button>
  </nav>

  <div data-panel="swing" role="tabpanel">
    <section id="buy"></section>
    <section id="mytrades"></section>
    <section id="mood"></section>
    <section id="plan"></section>
    <section id="patterns"></section>
    <section id="method"></section>
    <section id="howto"></section>
  </div>

  <div data-panel="day" role="tabpanel" hidden>
    <section id="daySettings"></section>
    <section id="dayPlan"></section>
    <section id="dayWatch"></section>
    <section id="dayTrades"></section>
    <section id="dayHowto"></section>
    <section id="dayMethod"></section>
  </div>

  <div data-panel="live" role="tabpanel" hidden>
    <section id="live"></section>
  </div>

  <footer class="foot" id="foot"></footer>
</main>

<template id="tradeForm">
  <form class="trade-form" autocomplete="off">
    <label>Stock<select name="sym" required></select></label>
    <label>Buy date<input name="date" type="date" required /></label>
    <label>Buy price (₹)<input name="price" type="number" inputmode="decimal" step="any" min="0.01" required /></label>
    <label>Shares<input name="qty" type="number" step="1" min="1" required /></label>
    <label>Target % (0 = trailing stop)<input name="tg" type="number" step="1" min="0" required /></label>
    <label>Stop-loss %<input name="st" type="number" step="1" min="1" required /></label>
    <label>Sell after (trading days)<input name="hold" type="number" step="1" min="1" required /></label>
    <button type="submit" class="btn">Save trade</button>
  </form>
</template>

<script src="daylogic.js"></script>
<script src="day.js"></script>
<script src="app.js"></script>
</body>
</html>
