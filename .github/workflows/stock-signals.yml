name: Update stock signals

on:
  # GitHub runs scheduled jobs on a best-effort basis and sometimes skips
  # one, so the daily update has backup slots. A run that finds no new
  # prices changes nothing.
  schedule:
    - cron: "10 13 * * 1-5"  # 6:40 PM IST, Mon-Fri: today's signals
    - cron: "40 14 * * 1-5"  # 8:10 PM IST backup
    - cron: "40 16 * * 1-5"  # 10:10 PM IST backup
    - cron: "40 1 * * 2-6"   # 7:10 AM IST next morning, before the market opens
    - cron: "40 2 * * 6"     # 8:10 AM IST Saturday: re-test every strategy
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = today's signals, full = also re-test every strategy"
        type: choice
        options: [daily, full]
        default: daily

permissions:
  contents: write

concurrency:
  group: stock-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - run: pip install -r screener/requirements.txt

      - name: Test the screener
        run: python -m pytest screener -q

      - name: Download prices and update signals
        env:
          MODE_INPUT: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${MODE_INPUT:-daily}"
          if [ "$SCHEDULE" = "40 2 * * 6" ]; then MODE=full; fi
          python screener/screener.py --mode "$MODE"

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/data screener/nifty100_fallback.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update stock signals for $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git push
