name: Update stock signals

# The page needs each trading day's closing prices by the evening. GitHub
# starts "schedule" runs on a best-effort basis, and in October 2026 they
# came 2-5 hours late or not at all. So an outside timer (a scheduled task
# in the owner's Claude account) starts this workflow with
# workflow_dispatch at 6:52 PM IST and again at 8:07 AM IST the next
# morning; the schedule below is a free fallback. Every daily run first
# checks whether the newest prices (and the next session's day-trading
# watch list) are already published and, if they are, stops within seconds.
# The Saturday run re-tests every swing strategy and, on a year of 5-minute
# prices, every day-trading setup.
on:
  schedule:
    - cron: "17 13 * * 1-5"  # 6:47 PM IST
    - cron: "47 14 * * 1-5"  # 8:17 PM IST
    - cron: "17 16 * * 1-5"  # 9:47 PM IST
    - cron: "47 17 * * 1-5"  # 11:17 PM IST
    - cron: "17 0 * * 2-6"   # 5:47 AM IST, the next morning
    - cron: "17 2 * * 2-6"   # 7:47 AM IST, the next morning
    - cron: "40 2 * * 6"     # 8:10 AM IST Saturday: re-test every strategy
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = today's signals, full = also re-test every strategy"
        type: choice
        options: [daily, full]
        default: daily
      force:
        description: "Update even if the newest prices are already on the page"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Daily runs go one at a time (a newer waiting run replaces an older
    # waiting one). The weekly re-test has its own queue, so a daily run can
    # never cancel it.
    concurrency:
      group: stock-signals-${{ (github.event.schedule == '40 2 * * 6' || inputs.mode == 'full') && 'full' || 'daily' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Start from the newest version
        # a run can start hours after it was scheduled, when main has moved on
        run: |
          git fetch -q --depth=1 origin main
          git reset -q --hard FETCH_HEAD

      - name: Decide what to do
        id: plan
        env:
          MODE_INPUT: ${{ inputs.mode }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${MODE_INPUT:-daily}"
          if [ "$SCHEDULE" = "40 2 * * 6" ]; then mode=full; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "daily" ] && [ "$FORCE" != "true" ]; then
            python3 screener/needs_update.py
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.needed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - if: steps.plan.outputs.needed == 'true'
        run: pip install -r screener/requirements.txt

      - name: Test the screener
        if: steps.plan.outputs.needed == 'true'
        run: python -m pytest screener -q

      - name: Download prices and update signals
        if: steps.plan.outputs.needed == 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set +e
          python screener/screener.py --mode "$MODE"
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::The price source didn't answer properly this time; the next run will try again."
            exit 0
          fi
          exit "$code"

      - name: Publish new data
        if: steps.plan.outputs.needed == 'true'
        run: bash screener/publish_data.sh
